# BiForexV3 configuration. Secrets (API keys) go to .env, never here.

symbols: [BTCUSDT, ETHUSDT]
timeframe: 4h                # chosen by walk-forward: H1 had no edge after costs

data:
  dir: data                  # relative to project root
  history_start: 2020-01-01
  intervals: [4h, 1h, 1m]    # 1m resolves bars where both SL and TP were touched
  funding: true
  metrics: true              # open interest, long/short ratios (5-minute, daily archives)
  download_workers: 8

features:
  context_symbol: BTCUSDT    # its returns/volatility are added as features for other symbols
  higher_timeframes: [1d]
  metrics_max_staleness: 3h  # open interest older than this counts as missing
  warmup_bars: 700           # first bars dropped: long EMAs are not ready yet

label:                       # triple-barrier: which is hit first within the horizon
  horizon_bars: 12           # time barrier, bars (12 x 4h = 2 days)
  tp_atr: 2.0                # take profit, ATR multiples
  sl_atr: 1.0                # stop loss, ATR multiples
  atr_period: 14
  intrabar_interval: 1m      # resolves bars where both TP and SL were touched

model:                       # LightGBM, 3 classes: down / flat / up
  pooled: true               # one model for all symbols (symbol_id feature); more data, more stable
  extra_symbols: []          # training-only symbols; 8 alts tested 2026-09-28: better log-loss, worse trading
  val_fraction: 0.15         # tail of the training window used for early stopping
  early_stopping_rounds: 300
  params:                    # strongly regularized: with lighter settings it overfit in <10 trees
    n_estimators: 3000
    learning_rate: 0.01
    num_leaves: 8
    min_child_samples: 300
    subsample: 0.7
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 10.0

signal:                      # model probabilities rarely exceed 0.5 (3 classes, noisy market)
  enter_prob: 0.40           # open when p_up (p_down) >= this and exceeds the other side
  exit_prob: 0.40            # close when the opposite side's probability reaches this

backtest:
  initial_equity: 5000       # same as the demo account
  threshold_grid: [0.36, 0.38, 0.40, 0.42, 0.45]   # all shown, to judge robustness

risk:
  per_trade_pct: 1.0         # target risk to the stop, % of equity
  max_trade_risk_pct: 5.0    # exchange minimum order may force more; skip the trade above this
  max_leverage: 5            # total open notional / equity (BTC min order is ~84 USDT)
  daily_loss_pct: 6.0        # no new entries for the rest of the UTC day
  max_dd_pct: 30.0           # stop opening positions for good; reset by hand

execution:
  testnet: false
  fee_taker: 0.0005
  fee_maker: 0.0002
  slippage_bps: 2            # market orders only
  entry_order: limit         # limit entries: half the fee; backtest +10..+25 pp vs market
  limit_offset_atr: 0.1      # limit price 0.1 ATR better than the signal bar close, valid 1 bar
  take_profit_limit: true    # TP rests as a limit order (maker); SL is a stop-market
  exchange_leverage: 10      # exchange setting (isolated): only margin locked per position;
                             # risk is limited by risk.max_leverage and the stop

retrain:
  every_days: 7
  train_months: 36

bot:
  poll_seconds: 30           # position / protective-order check interval
  bar_close_delay_seconds: 20  # wait after the 4h close so the exchange publishes the bar
  metrics_rest_hours: 40     # open interest etc. fetched via REST (archives lag one day)

logging:
  level: INFO
  dir: logs
