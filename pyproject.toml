[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biforex"
version = "0.1.0"
description = "ML trading bot for Binance USDT-M futures (successor of the MT4 + MATLAB system)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "scikit-learn>=1.4", "shap>=0.45", "minisom>=2.3"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
